<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель | Интерактивное голосование</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>

<!-- Login Screen -->
<div id="login-screen" class="login-page">
  <div class="card login-card">
    <span class="brand-mark login-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 20V11M12 20V4M18 20v-6"/></svg></span>
    <h2>Вход в админ-панель</h2>
    <p class="login-subtitle">Введите пароль для доступа к управлению голосованием</p>
    <div class="form-group">
      <label class="form-label" for="password-input">Пароль</label>
      <input type="password" class="form-input" id="password-input"
        placeholder="Введите пароль" autocomplete="current-password"
        onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <div id="login-error" class="hidden" style="color:var(--color-error);font-size:0.88rem;margin-bottom:12px;"></div>
    <button class="btn btn-primary btn-lg" onclick="doLogin()">Войти</button>
  </div>
</div>

<!-- Admin Panel -->
<div id="admin-panel" class="admin-layout hidden">

  <header class="page-header admin-header">
    <div class="admin-header-inner">
      <div class="admin-brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 20V11M12 20V4M18 20v-6"/></svg></span>
        <div>
          <div class="admin-brand-title">Панель управления</div>
          <div class="admin-brand-sub">Интерактивное голосование</div>
        </div>
      </div>
      <div id="active-indicator-header"></div>
    </div>
  </header>

  <div class="admin-main">

    <div class="stats-row">
      <div class="stat-card" id="connected-badge">
        <div class="stat-icon stat-icon-blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <div>
          <div class="stat-value"><span id="connected-count">—</span></div>
          <div class="stat-label">подключено сейчас</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon stat-icon-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>
        </div>
        <div>
          <div class="stat-value" id="stat-status">—</div>
          <div class="stat-label">текущий вопрос</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon stat-icon-violet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div>
          <div class="stat-value" id="stat-progress">—</div>
          <div class="stat-label">вопросов завершено</div>
        </div>
      </div>
    </div>

    <div class="admin-toolbar">
      <h2>Вопросы</h2>
      <div class="btn-group">
        <button class="btn btn-primary btn-sm" onclick="openEditor()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Добавить вопрос
        </button>
        <button class="btn btn-soft btn-sm" onclick="downloadExcel()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Excel
        </button>
        <button class="btn btn-soft btn-sm" onclick="window.open('/admin/results-print','_blank')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          PDF
        </button>
        <button class="btn btn-danger-soft btn-sm" onclick="resetAllClientVotes()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          Сбросить голоса у участников
        </button>
        <button class="btn btn-ghost btn-sm" onclick="doLogout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          Выйти
        </button>
      </div>
    </div>

    <div id="questions-list">
      <div class="panel-loading">Загрузка...</div>
    </div>

  </div>

  <!-- Question editor -->
  <div id="editor-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="editor-title">
    <div class="modal-dialog">
      <div class="modal-head">
        <h3 id="editor-title">Новый вопрос</h3>
        <button class="icon-btn" title="Закрыть" onclick="closeEditor()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="editor-body"></div>
      <div class="modal-foot">
        <div id="editor-error" class="editor-error hidden"></div>
        <button class="btn btn-ghost" onclick="closeEditor()">Отмена</button>
        <button class="btn btn-primary" id="editor-save" onclick="saveEditor()">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* ── State ──────────────────────────────────────────────────────────────── */
let appState = {
  questions: [],
  activeQuestionId: null
};
let socket = null;

const TYPE_LABELS = {
  scale_multi: 'Шкала 1–7',
  open_text: 'Открытый вопрос',
  matrix: 'Матрица',
  single_choice: 'Один вариант',
  multi_choice: 'Несколько вариантов'
};

/* ── Auth ───────────────────────────────────────────────────────────────── */
async function doLogin() {
  const pw = document.getElementById('password-input').value;
  if (!pw) return;

  const res = await fetch('/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  });
  const data = await res.json();

  if (data.success) {
    showAdminPanel();
  } else {
    const err = document.getElementById('login-error');
    err.textContent = data.message || 'Неверный пароль';
    err.classList.remove('hidden');
  }
}

async function doLogout() {
  await fetch('/admin/logout', { method: 'POST' });
  location.reload();
}

async function checkAuth() {
  const res = await fetch('/admin/check');
  const data = await res.json();
  if (data.authenticated) showAdminPanel();
}

/* ── Panel Init ─────────────────────────────────────────────────────────── */
function showAdminPanel() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('admin-panel').classList.remove('hidden');
  initSocket();
  loadState();
}

async function loadState() {
  const res = await fetch('/admin/state');
  if (!res.ok) { doLogout(); return; }
  const data = await res.json();
  appState.questions = data.questions;
  appState.activeQuestionId = data.activeQuestionId;
  renderQuestions();
}

/* ── Socket ─────────────────────────────────────────────────────────────── */
function initSocket() {
  socket = io();

  socket.on('connected_count', ({ count }) => {
    document.getElementById('connected-count').textContent = count;
    document.getElementById('connected-badge').style.display = 'flex';
  });

  socket.on('questions_changed', () => loadState());

  socket.on('vote_count_update', ({ questionId, count }) => {
    const q = appState.questions.find(q => q.id === questionId);
    if (q) q.voteCount = count;
    const el = document.getElementById(`vote-count-${questionId}`);
    if (el) el.textContent = count;
  });

  socket.on('question_activated', ({ question }) => {
    // Update statuses in local state
    appState.questions.forEach(q => {
      if (q.status === 'active') q.status = 'closed';
    });
    const q = appState.questions.find(q => q.id === question.id);
    if (q) q.status = 'active';
    appState.activeQuestionId = question.id;
    renderQuestions();
  });

  socket.on('question_closed', ({ questionId, results }) => {
    const q = appState.questions.find(q => q.id === questionId);
    if (q) {
      q.status = 'closed';
      q.lastResults = results;
    }
    appState.activeQuestionId = null;
    renderQuestions();
    // Auto-show results in admin panel
    showAdminResults(questionId, results);
  });
}

/* ── Actions ────────────────────────────────────────────────────────────── */
function activateQuestion(questionId) {
  socket.emit('activate_question', { questionId }, (res) => {
    if (res && res.error) { showToast(res.error); return; }
  });
}

function closeQuestion(questionId) {
  socket.emit('close_question', { questionId }, (res) => {
    if (res && res.error) { showToast(res.error); return; }
  });
}

function showResultsToAll(questionId) {
  socket.emit('show_results', { questionId }, (res) => {
    if (res && res.error) { showToast(res.error); return; }
    showToast('Результаты показаны участникам', 'success');
  });
}

function downloadExcel() {
  window.location.href = '/admin/export';
}

function resetAllClientVotes() {
  if (!confirm('Сбросить историю голосования у всех участников? Они смогут проголосовать заново.')) return;
  socket.emit('reset_client_votes', {}, (res) => {
    if (res && res.error) { showToast(res.error); return; }
    showToast('Голоса участников сброшены', 'success');
  });
}

function resetQuestion(questionId) {
  if (!confirm('Сбросить ответы по этому вопросу?')) return;
  socket.emit('reset_question', { questionId }, (res) => {
    if (res && res.error) { showToast(res.error); return; }
    const q = appState.questions.find(q => q.id === questionId);
    if (q) { q.status = 'inactive'; q.voteCount = 0; delete q.lastResults; }
    if (appState.activeQuestionId === questionId) appState.activeQuestionId = null;
    renderQuestions();
  });
}

function toggleAdminResults(questionId) {
  const panel = document.getElementById(`results-panel-${questionId}`);
  if (!panel) return;
  panel.classList.toggle('hidden');

  if (!panel.classList.contains('hidden')) {
    const q = appState.questions.find(q => q.id === questionId);
    if (q && q.lastResults) {
      panel.innerHTML = buildResultsHtml(q.lastResults);
    } else {
      // Load from server
      fetch(`/admin/results/${questionId}`)
        .then(r => r.json())
        .then(results => {
          const q2 = appState.questions.find(q => q.id === questionId);
          if (q2) q2.lastResults = results;
          panel.innerHTML = buildResultsHtml(results);
        });
    }
  }
}

function showAdminResults(questionId, results) {
  const panel = document.getElementById(`results-panel-${questionId}`);
  if (panel) {
    panel.classList.remove('hidden');
    panel.innerHTML = buildResultsHtml(results);
  }
}

/* ── Render ─────────────────────────────────────────────────────────────── */
function renderQuestions() {
  const container = document.getElementById('questions-list');

  // Update active indicator in header
  const hdrIndicator = document.getElementById('active-indicator-header');
  if (appState.activeQuestionId) {
    hdrIndicator.innerHTML = `<span class="active-indicator"><span class="dot"></span>Идёт голосование</span>`;
  } else {
    hdrIndicator.innerHTML = '';
  }

  const activeIdx = appState.questions.findIndex(q => q.id === appState.activeQuestionId);
  document.getElementById('stat-status').textContent =
    activeIdx >= 0 ? `Вопрос ${activeIdx + 1}` : 'Нет активного';
  const closedCount = appState.questions.filter(q => q.status === 'closed').length;
  document.getElementById('stat-progress').textContent = `${closedCount} из ${appState.questions.length}`;

  let html = '';
  appState.questions.forEach((q, idx) => {
    const isActive = q.id === appState.activeQuestionId || q.status === 'active';
    const isClosed = q.status === 'closed';

    html += `<div class="question-admin-card ${isActive ? 'active' : ''} ${isClosed && !isActive ? 'closed' : ''}" id="qcard-${q.id}">`;

    // Header
    html += `<div class="question-admin-header">`;
    html += `<div class="q-index">${idx + 1}</div>`;
    html += `<div class="question-admin-meta">`;
    html += `<div class="question-admin-type">${TYPE_LABELS[q.type] || q.type}</div>`;
    html += `<div class="question-admin-text">${escHtml(q.text)}</div>`;
    html += `</div>`;

    // Actions
    html += `<div class="question-admin-actions">`;

    if (isActive) {
      // Status + vote count + close button
      html += `<span class="status-badge active"><span class="status-dot"></span>Активен</span>`;
      html += `<span class="vote-counter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span id="vote-count-${q.id}">${q.voteCount || 0}</span></span>`;
      html += `<button class="btn btn-danger btn-sm" onclick="closeQuestion('${q.id}')">Завершить</button>`;
    } else if (isClosed) {
      html += `<span class="status-badge closed"><span class="status-dot"></span>Завершён</span>`;
      html += `<span class="vote-counter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>${q.voteCount || 0}</span>`;
      html += `<button class="btn btn-outline btn-sm" onclick="toggleAdminResults('${q.id}')">Результаты</button>`;
      html += `<button class="btn btn-primary btn-sm" onclick="showResultsToAll('${q.id}')">Показать участникам</button>`;
      html += `<button class="btn btn-success btn-sm" onclick="activateQuestion('${q.id}')">Открыть снова</button>`;
      html += `<button class="btn btn-outline btn-sm" onclick="resetQuestion('${q.id}')">Сбросить</button>`;
    } else {
      // Inactive
      html += `<span class="status-badge inactive"><span class="status-dot"></span>Неактивен</span>`;
      if (!appState.activeQuestionId) {
        html += `<button class="btn btn-success btn-sm" onclick="activateQuestion('${q.id}')">Запустить</button>`;
      } else {
        html += `<button class="btn btn-success btn-sm" disabled title="Сначала завершите активный вопрос">Запустить</button>`;
      }
    }

    html += `<div class="q-tools">
      <button class="icon-btn" title="${isActive ? 'Сначала завершите голосование' : 'Изменить'}" onclick="openEditor('${q.id}')" ${isActive ? 'disabled' : ''}>${ICONS.edit}</button>
      <button class="icon-btn" title="Выше" onclick="moveQuestion('${q.id}', -1)" ${idx === 0 ? 'disabled' : ''}>${ICONS.up}</button>
      <button class="icon-btn" title="Ниже" onclick="moveQuestion('${q.id}', 1)" ${idx === appState.questions.length - 1 ? 'disabled' : ''}>${ICONS.down}</button>
      <button class="icon-btn icon-btn-danger" title="${isActive ? 'Сначала завершите голосование' : 'Удалить'}" onclick="deleteQuestion('${q.id}')" ${isActive ? 'disabled' : ''}>${ICONS.trash}</button>
    </div>`;
    html += `</div>`; // actions
    html += `</div>`; // header

    // Results panel (collapsed by default)
    html += `<div id="results-panel-${q.id}" class="admin-results-block hidden">`;
    if (isClosed && q.lastResults) {
      html += buildResultsHtml(q.lastResults);
    }
    html += `</div>`;

    html += `</div>`; // card
  });

  if (!appState.questions.length) {
    html = `<div class="empty-state">
      <div class="empty-title">Вопросов пока нет</div>
      <p>Нажмите «Добавить вопрос», чтобы создать первый.</p>
    </div>`;
  }

  container.innerHTML = html;
}

/* ── Results HTML Builder ───────────────────────────────────────────────── */
function buildResultsHtml(results) {
  if (!results) return '<p class="text-muted">Нет данных</p>';

  let html = `<div style="margin-top:12px">`;
  html += `<p class="results-count" style="margin-bottom:14px;">Всего ответов: <strong>${results.count || results.totalCount || 0}</strong></p>`;

  if (results.type === 'open_text') {
    if (!results.answers || results.answers.length === 0) {
      html += `<p class="text-muted">Ответов нет.</p>`;
    } else {
      results.answers.forEach(ans => {
        html += `<div class="open-text-answer">${escHtml(ans)}</div>`;
      });
    }
  }

  if (results.type === 'scale_multi') {
    results.items.forEach(item => {
      html += `<div class="result-item-section-admin">`;
      html += `<div class="result-item-title">${escHtml(item.text)}</div>`;
      html += `<div class="result-average">Среднее: ${item.average}</div>`;

      const maxCount = Math.max(...Object.values(item.distribution), 1);
      html += `<div class="bar-chart" style="margin-top:10px;">`;
      for (let v = 1; v <= 7; v++) {
        const cnt = item.distribution[v] || 0;
        const pct = Math.round((cnt / maxCount) * 100);
        html += `<div class="bar-row">
          <span class="bar-label">${v}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <span class="bar-count">${cnt}</span>
        </div>`;
      }
      html += `</div>`;

      if (item.hasInput && item.textEntries && item.textEntries.length > 0) {
        html += `<div class="text-entries" style="margin-top:10px;">
          <div class="text-entries-title">Варианты «Другое»:</div>`;
        item.textEntries.forEach(entry => {
          html += `<div class="text-entry">
            <span class="text-entry-text">${escHtml(entry.text)}</span>
            <span class="text-entry-score">оценка: ${entry.value}</span>
          </div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    });
  }

  if (results.type === 'single_choice' || results.type === 'multi_choice') {
    const maxCount = Math.max(...results.options.map(o => o.count), 1);
    html += `<div class="bar-chart">`;
    results.options.forEach(o => {
      html += `<div class="result-item-title" style="margin-top:8px">${escHtml(o.text)}</div>
        <div class="bar-row">
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(o.count / maxCount * 100)}%"></div></div>
          <span class="bar-count" style="width:auto">${o.count} (${o.pct}%)</span>
        </div>`;
    });
    html += `</div>`;
  }

  if (results.type === 'matrix') {
    html += buildMatrixResultsHtml(results);
  }

  html += `</div>`;
  return html;
}

function buildMatrixResultsHtml(results) {
  const { rows, columns, sumMatrix, avgMatrix } = results;

  function table(matrix, title) {
    const allNums = matrix.flatMap(row => row.map(v => parseFloat(v) || 0));
    const maxVal = Math.max(...allNums, 1);

    let t = `<div class="matrix-results-section" style="margin-bottom:20px;">`;
    t += `<h3 style="margin-bottom:10px;">${title}</h3>`;
    t += `<div class="results-matrix-admin matrix-container"><table class="results-matrix-table">`;
    t += `<thead><tr><th></th>`;
    columns.forEach(col => { t += `<th>${escHtml(col)}</th>`; });
    t += `</tr></thead><tbody>`;
    rows.forEach((row, ri) => {
      t += `<tr><td>${escHtml(row)}</td>`;
      columns.forEach((_, ci) => {
        const val = matrix[ri][ci];
        const num = parseFloat(val) || 0;
        const ratio = num / maxVal;
        const bg = heatColor(ratio);
        const textColor = ratio > 0.6 ? '#fff' : '#2d3748';
        t += `<td style="background:${bg};color:${textColor}">${val}</td>`;
      });
      t += `</tr>`;
    });
    t += `</tbody></table></div></div>`;
    return t;
  }

  return table(sumMatrix, 'Суммарные оценки') + table(avgMatrix, 'Средние оценки');
}

/* ── Helpers ────────────────────────────────────────────────────────────── */
function heatColor(ratio) {
  const r = Math.round(255 + ratio * (39 - 255));
  const g = Math.round(255 + ratio * (122 - 255));
  const b = Math.round(255 + ratio * (73 - 255));
  return `rgb(${r},${g},${b})`;
}

function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function showToast(msg, type = 'error') {
  const t = document.createElement('div');
  t.className = 'toast';
  if (type === 'success') {
    t.style.background = 'var(--color-success)';
  }
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

/* ── Question editor ────────────────────────────────────────────────────── */
const ICONS = {
  edit:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  up:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>',
  down:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>',
  x:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>'
};

const EDITOR_TYPES = [
  { type: 'single_choice', title: 'Один вариант',        desc: 'Выбор одного ответа' },
  { type: 'multi_choice',  title: 'Несколько вариантов', desc: 'Можно отметить несколько' },
  { type: 'scale_multi',   title: 'Шкала 1–7',           desc: 'Оценка каждого пункта' },
  { type: 'open_text',     title: 'Открытый вопрос',     desc: 'Ответ своими словами' },
  { type: 'matrix',        title: 'Матрица',             desc: 'Варианты × критерии' }
];
const DEFAULT_SCALE_LABEL = '1 – категорически не поддерживаю, 2 – не поддерживаю, 3 – скорее не поддерживаю, 4 – затрудняюсь ответить, 5 – скорее поддерживаю, 6 – поддерживаю, 7 – в высшей степени поддерживаю';

let editor = null;

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

// Same wording the server generates, so auto hints are not shown as custom text
function autoHint(q) {
  if (q.type === 'single_choice') return 'Выберите один вариант';
  const min = q.minSelect || 1, max = q.maxSelect || null;
  if (max && min === max) return `Выберите ${min} ${plural(min, 'вариант', 'варианта', 'вариантов')}`;
  if (max) return `Выберите от ${min} до ${max} ${plural(max, 'варианта', 'вариантов', 'вариантов')}`;
  return min > 1 ? `Выберите не менее ${min} вариантов` : 'Выберите все подходящие варианты';
}

function openEditor(id) {
  const q = id ? appState.questions.find(x => x.id === id) : null;
  const list = q ? (q.options || q.items || []).map(o => ({ id: o.id, text: o.text, hasInput: !!o.hasInput })) : [];
  editor = {
    id: q ? q.id : null,
    voteCount: q ? (q.voteCount || 0) : 0,
    type: q ? q.type : 'single_choice',
    text: q ? q.text : '',
    hint: q && q.hint && q.hint !== autoHint(q) ? q.hint : '',
    minSelect: q && q.minSelect ? q.minSelect : 1,
    maxSelect: q && q.maxSelect ? q.maxSelect : '',
    list: list.length ? list : [{ text: '' }, { text: '' }],
    scaleLabel: q && q.scaleLabel ? q.scaleLabel : DEFAULT_SCALE_LABEL,
    matrixDescription: q && q.matrixDescription ? q.matrixDescription : '',
    rows: q && q.rows ? q.rows.map(t => ({ text: t })) : [{ text: '' }],
    columns: q && q.columns ? q.columns.map(t => ({ text: t })) : [{ text: '' }, { text: '' }],
    cellMin: q && q.cellValues ? q.cellValues[0] : 1,
    cellMax: q && q.cellValues ? q.cellValues[q.cellValues.length - 1] : 5
  };
  document.getElementById('editor-title').textContent = q ? 'Редактирование вопроса' : 'Новый вопрос';
  document.getElementById('editor-error').classList.add('hidden');
  renderEditor();
  document.getElementById('editor-modal').classList.remove('hidden');
  document.body.classList.add('modal-open');
  setTimeout(() => {
    const t = document.getElementById('ed-text');
    const modal = document.getElementById('editor-modal');
    if (t && !modal.contains(document.activeElement)) t.focus();
  }, 50);
}

function closeEditor() {
  editor = null;
  document.getElementById('editor-modal').classList.add('hidden');
  document.body.classList.remove('modal-open');
}

function setEditorType(type) {
  editor.type = type;
  renderEditor();
}

function listEditor(key, { label, placeholder, addLabel, withOther }) {
  const items = editor[key];
  let h = `<div class="ed-field"><label class="ed-label">${label}</label><div class="le">`;
  items.forEach((it, i) => {
    h += `<div class="le-row">
      <span class="le-num">${i + 1}</span>
      <input class="form-input" id="le-${key}-${i}" value="${escHtml(it.text)}" placeholder="${placeholder}"
        oninput="editor.${key}[${i}].text = this.value">
      ${withOther ? `<label class="le-other" title="Участник сможет вписать свой вариант"><input type="checkbox" ${it.hasInput ? 'checked' : ''} onchange="editor.${key}[${i}].hasInput = this.checked"> своё поле</label>` : ''}
      <button type="button" class="icon-btn" title="Выше" onclick="moveListItem('${key}', ${i}, -1)" ${i === 0 ? 'disabled' : ''}>${ICONS.up}</button>
      <button type="button" class="icon-btn" title="Ниже" onclick="moveListItem('${key}', ${i}, 1)" ${i === items.length - 1 ? 'disabled' : ''}>${ICONS.down}</button>
      <button type="button" class="icon-btn icon-btn-danger" title="Удалить" onclick="removeListItem('${key}', ${i})">${ICONS.x}</button>
    </div>`;
  });
  h += `</div><button type="button" class="btn btn-soft btn-sm le-add" onclick="addListItem('${key}')">+ ${addLabel}</button></div>`;
  return h;
}

function addListItem(key) {
  editor[key].push({ text: '' });
  renderEditor();
  const el = document.getElementById(`le-${key}-${editor[key].length - 1}`);
  if (el) el.focus();
}
function removeListItem(key, i) { editor[key].splice(i, 1); renderEditor(); }
function moveListItem(key, i, dir) {
  const j = i + dir, arr = editor[key];
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  renderEditor();
}

function renderEditor() {
  const e = editor;
  let h = '';

  if (e.id && e.voteCount > 0) {
    h += `<div class="ed-warning">У этого вопроса уже есть ответы (${e.voteCount}). После сохранения они будут удалены, и вопрос можно будет провести заново.</div>`;
  }

  h += `<div class="ed-field"><label class="ed-label">Тип вопроса</label><div class="type-grid">`;
  EDITOR_TYPES.forEach(t => {
    h += `<button type="button" class="type-tile ${e.type === t.type ? 'selected' : ''}" onclick="setEditorType('${t.type}')">
      <span class="type-title">${t.title}</span><span class="type-desc">${t.desc}</span></button>`;
  });
  h += `</div></div>`;

  h += `<div class="ed-field"><label class="ed-label" for="ed-text">Текст вопроса</label>
    <textarea class="form-textarea" id="ed-text" rows="3" maxlength="1000" placeholder="Например: Какие направления развития Вы считаете приоритетными?"
      oninput="editor.text = this.value">${escHtml(e.text)}</textarea></div>`;

  if (e.type === 'single_choice' || e.type === 'multi_choice') {
    h += listEditor('list', { label: 'Варианты ответа', placeholder: 'Текст варианта', addLabel: 'Добавить вариант' });
    if (e.type === 'multi_choice') {
      h += `<div class="ed-field ed-inline">
        <div><label class="ed-label">Минимум выбрать</label>
          <input class="form-input ed-num" type="number" min="1" value="${escHtml(String(e.minSelect))}" oninput="editor.minSelect = this.value"></div>
        <div><label class="ed-label">Максимум выбрать</label>
          <input class="form-input ed-num" type="number" min="1" placeholder="без ограничения" value="${escHtml(String(e.maxSelect))}" oninput="editor.maxSelect = this.value"></div>
      </div>`;
    }
    h += `<div class="ed-field"><label class="ed-label">Подсказка участникам <span class="ed-opt">необязательно, по умолчанию сформируется сама</span></label>
      <input class="form-input" maxlength="200" value="${escHtml(e.hint)}" placeholder="${e.type === 'single_choice' ? 'Выберите один вариант' : 'Например: Выберите от одного до трех вариантов'}" oninput="editor.hint = this.value"></div>`;
  }

  if (e.type === 'scale_multi') {
    h += listEditor('list', { label: 'Пункты для оценки по шкале 1–7', placeholder: 'Что оценивают участники', addLabel: 'Добавить пункт', withOther: true });
    h += `<div class="ed-field"><label class="ed-label">Легенда шкалы</label>
      <textarea class="form-textarea" rows="3" maxlength="500" oninput="editor.scaleLabel = this.value">${escHtml(e.scaleLabel)}</textarea></div>`;
  }

  if (e.type === 'matrix') {
    h += listEditor('columns', { label: 'Столбцы — варианты', placeholder: 'Название варианта', addLabel: 'Добавить столбец' });
    h += listEditor('rows', { label: 'Строки — критерии', placeholder: 'Критерий оценки', addLabel: 'Добавить строку' });
    h += `<div class="ed-field ed-inline">
      <div><label class="ed-label">Минимальная оценка</label>
        <input class="form-input ed-num" type="number" min="0" max="9" value="${escHtml(String(e.cellMin))}" oninput="editor.cellMin = this.value"></div>
      <div><label class="ed-label">Максимальная оценка</label>
        <input class="form-input ed-num" type="number" min="1" max="10" value="${escHtml(String(e.cellMax))}" oninput="editor.cellMax = this.value"></div>
    </div>`;
    h += `<div class="ed-field"><label class="ed-label">Пояснение для участников <span class="ed-opt">необязательно</span></label>
      <textarea class="form-textarea" rows="2" maxlength="500" oninput="editor.matrixDescription = this.value">${escHtml(e.matrixDescription)}</textarea></div>`;
  }

  if (e.type === 'open_text') {
    h += `<div class="ed-note">Участники ответят своими словами. На экране результатов ответы будут показаны облаком высказываний.</div>`;
  }

  document.getElementById('editor-body').innerHTML = h;
}

async function saveEditor() {
  const e = editor;
  if (!e) return;
  const errEl = document.getElementById('editor-error');
  errEl.classList.add('hidden');

  const question = {
    type: e.type,
    text: e.text,
    hint: e.hint,
    minSelect: e.minSelect,
    maxSelect: e.maxSelect === '' ? null : e.maxSelect,
    options: e.list,
    items: e.list,
    scaleLabel: e.scaleLabel,
    matrixDescription: e.matrixDescription,
    rows: e.rows,
    columns: e.columns,
    cellMin: e.cellMin,
    cellMax: e.cellMax
  };

  const btn = document.getElementById('editor-save');
  btn.disabled = true;
  try {
    const res = await fetch(e.id ? `/admin/questions/${encodeURIComponent(e.id)}` : '/admin/questions', {
      method: e.id ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, confirmReset: e.voteCount > 0 })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (res.status === 401) { doLogout(); return; }
      errEl.textContent = data.error || 'Не удалось сохранить';
      errEl.classList.remove('hidden');
      return;
    }
    closeEditor();
    showToast(e.id ? 'Вопрос сохранён' : 'Вопрос добавлен', 'success');
    loadState();
  } catch (err) {
    errEl.textContent = 'Нет связи с сервером';
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
  }
}

async function deleteQuestion(id) {
  const q = appState.questions.find(x => x.id === id);
  if (!q) return;
  const short = q.text.length > 80 ? q.text.slice(0, 80) + '…' : q.text;
  const extra = q.voteCount ? `\n\nОтветы по нему (${q.voteCount}) тоже будут удалены.` : '';
  if (!confirm(`Удалить вопрос?\n\n«${short}»${extra}`)) return;
  const res = await fetch(`/admin/questions/${encodeURIComponent(id)}`, { method: 'DELETE' });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { showToast(data.error || 'Не удалось удалить'); return; }
  showToast('Вопрос удалён', 'success');
  loadState();
}

async function moveQuestion(id, dir) {
  const ids = appState.questions.map(q => q.id);
  const i = ids.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  const res = await fetch('/admin/questions/reorder', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ids })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { showToast(data.error || 'Не удалось переместить'); }
  loadState();
}

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && editor) closeEditor();
});
document.getElementById('editor-modal').addEventListener('input', () => {
  document.getElementById('editor-error').classList.add('hidden');
});

/* ── Init ───────────────────────────────────────────────────────────────── */
checkAuth();
</script>
</body>
</html>
